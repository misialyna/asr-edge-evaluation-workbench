[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "asr-edge-evaluation-workbench"
version = "0.1.0"
description = "Benchmarking tool for ASR models on edge hardware (NVIDIA Jetson Orin)"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "ASR Edge Evaluation Team"}
]
requires-python = ">=3.9"
dependencies = [
    "faster-whisper>=0.8.0",
    "pydantic>=2.0",
    "jinja2>=3.1.0",
    "matplotlib>=3.7.0",
    "streamlit>=1.28.0",
    "pandas>=2.0.0",
    "pyarrow>=12.0.0",
    "jiwer>=2.7.0",
    "psutil>=5.9.0",
    "pyyaml>=6.0",
    "numpy>=1.21.0",
    "structlog>=23.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
]
dashboard = [
    "streamlit>=1.28.0",
    "plotly>=5.14.0",
]

[project.urls]
Homepage = "https://github.com/misialyna/asr-edge-evaluation-workbench"
Repository = "https://github.com/misialyna/asr-edge-evaluation-workbench.git"

[tool.setuptools]
packages = ["asr_edge_eval"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.ruff]
line-length = 100
target-version = "py39"
